name: inventaria
description: Inventory management app - Flutter port of InventarIA
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # ── Navigation ──
  go_router: ^14.2.7

  # ── Firebase ──
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

  # ── Persistence ──
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # ── Charts ──
  fl_chart: ^0.69.0

  # ── Formatting / Localisation ──
  intl: ^0.19.0

  # ── Camera & ML ──
  camera: ^0.10.5+9
  google_mlkit_barcode_scanning: ^0.12.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # ── Networking ──
  http: ^1.2.1

  # ── Utils ──
  uuid: ^4.4.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.6.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
